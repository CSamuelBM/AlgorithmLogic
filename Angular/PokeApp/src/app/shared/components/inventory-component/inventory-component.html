<main class="main">
  <p>{{num()}}</p>
  <div class="main main__content__row">
    <button (click)="incrementNum.emit()">Incrementar</button>
    <button (click)="previousNum.emit()">Anterior</button>
    <button (click)="decrementNum.emit()">Decrementar</button>
    <button (click)="cleareNum.emit()">Limpiar</button>
  </div>
</main>
